      <div class="ttl">
        <div class="brand"><img src="img/logo.svg" alt=""><span>Cherdak</span></div>

        <h1>Course Workbook</h1>

      <div class="sp"></div>

      <div id="unit-bar"></div>

    </div>
  </div>
